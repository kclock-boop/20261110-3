<!doctype html><html lang="ko"><meta charset="utf-8"><title>시험용 게시판</title><style>body{max-width:760px;margin:40px auto;font:18px sans-serif;background:#f3f6fa;color:#18324d}input,textarea{display:block;width:95%;padding:12px;margin:10px 0;font:inherit}button{padding:12px;background:#205cb5;color:white;border:0}article{background:white;padding:20px;margin-top:20px;white-space:pre-wrap}</style><h1>시험용 게시판</h1><p>회사 게시판과 연결되지 않는 로컬 연습 화면입니다.</p><form id="form"><label>제목<input id="title" required></label><label>내용<textarea id="body" rows="7" required></textarea></label><button id="submit">등록</button></form><p id="success" hidden>등록되었습니다</p><article id="post" hidden></article><script>document.querySelector('#form').onsubmit=e=>{e.preventDefault();document.querySelector('#post').textContent=document.querySelector('#title').value+'\n\n'+document.querySelector('#body').value;document.querySelector('#post').hidden=false;document.querySelector('#success').hidden=false;};</script></html>
